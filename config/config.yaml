project:
  name: "Wind Farm AI Energy Intelligence Platform"
  stage: "prototype"

paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  models_dir: "models"
  figures_dir: "reports/figures"
  logs_dir: "logs"

raw_files:
  long_term_climate: "Dataset-4 Long term wind climate dataset 20 years 10min.csv"
  power_curve: "Dataset-5 Turbine power curve dataset.csv"
  scada: "Dataset-6  Wind farm scada 1year.csv"
  alarms: "Dataset-7 Turbine alarm event dataset 3year 50turbines 150k events.csv"
  maintenance: "Dataset-8  Wind turbine maintenance dataset 3year 50turbines 25000 records.csv"
  grid_curtailment: "Dataset-9 Grid and Curtailment dataset 10000 rows.csv"
  gis_terrain: "Dtaset-10 GIS Terrain Dataset.csv"
  layout_actual: "Dataset-11 (A) Actual Wind Farm Layout.csv"
  layout_candidates: "Dataset-11 (B) AI Candidate Layouts 10000.csv"
  layout_position_features: "Dataset-11 (C) Layout Position Features 10000.csv"
  weather_forecast: "Dataset-12 weather forecast 10000 rows.csv"
  simple_flat_dataset: "wind_energy_dataset_100- 10000 Row.csv"

modeling:
  chronological_split:
    train: 0.7
    val: 0.15
    test: 0.15
  target_variables:
    - active_power_kw
  random_seed: 42

turbine_defaults:
  rated_power_kw: 2500
  cut_in_speed_mps: 3
  rated_speed_mps: 11
  cut_out_speed_mps: 25

agents:
  # Grid Agent -- no live grid connection exists for this site/period (Dataset-9
  # doesn't overlap the SCADA date range, confirmed Day 2), so this capacity is
  # an ASSUMED planning constraint for demo purposes, not a measured limit.
  grid_export_capacity_kwh_per_day: 22000
  # Carbon Agent -- typical grid emission factor assumption for India (CEA
  # baseline database, all-India average is commonly cited around 0.7-0.9
  # kg CO2/kWh depending on year/source). Treat as an adjustable assumption,
  # not a precise site-specific figure, and say so in the demo.
  grid_emission_factor_kg_co2_per_kwh: 0.82
  # Maintenance Agent -- risk_score threshold above which a turbine is flagged
  # for inspection rather than routine monitoring (score formula defined in
  # src/agents/context_builder.py::get_turbine_health_ranking)
  maintenance_risk_score_threshold: 15

battery:
  n_batteries: 4
  max_charge_rate_kw: 500
  max_discharge_rate_kw: 500
  capacity_kwh: 2000
  min_soc_pct: 10
  max_soc_pct: 95
  round_trip_efficiency: 0.9
